name: Update Remnawave upstream

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x-out-upstream-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ckeiituk/subscription-page'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Prepare release PR and start checks
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_REPOSITORY: ${{ github.repository }}
          UPDATE_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Keep running the reviewed updater even if the merge changes its source.
          cp scripts/update-upstream.py "$RUNNER_TEMP/update-upstream.py"
          python3 "$RUNNER_TEMP/update-upstream.py"
